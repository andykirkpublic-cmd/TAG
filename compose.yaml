services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: tag
      POSTGRES_USER: tag
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U tag -d tag']
      interval: 5s
      timeout: 3s
      retries: 20
  migrate:
    build: .
    command: [python, -m, tag.manage, init]
    environment:
      DATABASE_URL: postgresql://tag:${POSTGRES_PASSWORD}@db:5432/tag
    depends_on:
      db:
        condition: service_healthy
  app:
    build: .
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://tag:${POSTGRES_PASSWORD}@db:5432/tag
      PUBLIC_URL: ${PUBLIC_URL:-https://tag.trykobi.com}
      SCHOOL_NAME: ${SCHOOL_NAME:-TAG Pilot School}
      TRUST_PROXY: '1'
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://localhost:8000/healthz', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - '80:80'
      - '443:443'
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      app:
        condition: service_healthy
volumes:
  postgres_data:
  caddy_data:
  caddy_config:
