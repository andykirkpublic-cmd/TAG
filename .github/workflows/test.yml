name: TAG pilot checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: tagtest
          POSTGRES_PASSWORD: disposable-test-only
          POSTGRES_DB: tagtest
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U tagtest -d tagtest"
          --health-interval 5s --health-timeout 3s --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: pip install -r requirements.txt
      - name: SQLite workflow tests
        run: python -m unittest discover -s tests -v
      - name: PostgreSQL workflow tests
        env:
          TEST_DATABASE_URL: postgresql://tagtest:disposable-test-only@localhost:5432/tagtest
        run: python -m unittest discover -s tests -v
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: node --check tag/static/app.js
      - run: npm run test:browser
      - name: Save fictional pilot screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pilot-screenshots
          path: /tmp/tag-*.png
          retention-days: 7
      - name: Validate deployment configuration
        env:
          POSTGRES_PASSWORD: disposable-test-only
        run: docker compose config --quiet
      - name: Build production image
        run: docker build -t tag-pilot:test .
